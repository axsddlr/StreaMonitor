services:
  streamonitor:
    # image: ghcr.io/axsddlr/streamonitor:enhanced
    build: .

    restart: unless-stopped
    environment:
      # set timzeone
      #TZ: Etc/UTC
      # unset password (admin by default)
      #STRMNTR_PASSWORD: ''
      # unbind web interface (bound to 127.0.0.1 by default)
      STRMNTR_HOST: '0.0.0.0'
      # keep all mutable state in the mounted data directory
      STRMNTR_CONFIG: '/app/data/config.json'
      STRMNTR_MOUFLON_KEYS: '/app/data/stripchat_mouflon_keys.json'
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '5000:5000'
