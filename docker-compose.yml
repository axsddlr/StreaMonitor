services:
  streamonitor:
    # image: ghcr.io/axsddlr/streamonitor:enhanced
    build: .

    restart: unless-stopped
    environment:
      # set timezone
      TZ: ${TZ}
      # web UI password (username: admin); empty = no auth
      STRMNTR_PASSWORD: ${STRMNTR_PASSWORD}
      # unbind web interface (bound to 127.0.0.1 by default outside docker)
      STRMNTR_HOST: ${STRMNTR_HOST}
      # keep all mutable state in the mounted data directory
      STRMNTR_CONFIG: ${STRMNTR_CONFIG}
      STRMNTR_MOUFLON_KEYS: ${STRMNTR_MOUFLON_KEYS}
      # enable debug logging (writes ffmpeg .stderr.log next to recordings)
      STRMNTR_DEBUG: ${STRMNTR_DEBUG}
      STRMNTR_MIN_FREE_SPACE_GB: ${STRMNTR_MIN_FREE_SPACE_GB}
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '5000:5000'
